# Kyverno admission policies for the SecureCloud baseline (Phase 4).
#
# These are cluster-scoped ClusterPolicies. The BASE is intentionally loaded in
# AUDIT mode (validationFailureAction: Audit) so you can measure violations with
# PolicyReports before enforcing. Apply the enforce overlay to flip them:
#
#   kubectl apply -k kubernetes/policies            # audit
#   kubectl apply -k kubernetes/policies/enforce    # enforce
#
# See docs/PHASE-4-KUBERNETES-SECURITY.md for the threat model and tests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - disallow-root.yaml
  - disallow-privilege-escalation.yaml
  - require-drop-capabilities.yaml
  - require-resource-limits.yaml
  - disallow-latest-tag.yaml
  - restrict-image-registries.yaml
  - disallow-host-network.yaml
  - disallow-host-path.yaml
