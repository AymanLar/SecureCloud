# Phase 4 RBAC review - least privilege for the application.
#
# Findings and decisions:
#   1. Every workload gets its OWN ServiceAccount (no shared "default").
#   2. Nothing is bound to cluster-admin or any ClusterRole. Each account is
#      bound to the namespaced, deliberately EMPTY Role "securecloud-app", so
#      even stolen pod credentials grant zero API verbs.
#   3. automountServiceAccountToken: false - the application never calls the
#      Kubernetes API, so its pods do not even receive a mounted token. This
#      removes the most common credential-theft primitive outright.
#
# Verify with: bash scripts/rbac-review.sh
apiVersion: v1
kind: ServiceAccount
metadata:
  name: securecloud-backend
  namespace: securecloud
  labels:
    app.kubernetes.io/part-of: securecloud
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: securecloud-frontend
  namespace: securecloud
  labels:
    app.kubernetes.io/part-of: securecloud
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: securecloud-postgres
  namespace: securecloud
  labels:
    app.kubernetes.io/part-of: securecloud
automountServiceAccountToken: false
