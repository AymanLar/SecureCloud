# SecureCloud CI/CD + shift-left security + supply-chain pipeline.
#
# Pipeline (each job runs only after the previous one succeeds):
#
#   lint -> unit-tests -> sast -> secret-scan -> dependency-scan
#        -> docker-build -> container-scan -> sbom -> publish -> sign -> verify -> deploy
#
#   Test/SAST     ruff, eslint, pytest, semgrep, gitleaks
#   Dependency    trivy fs
#   Build         docker compose build
#   Trivy scan    trivy image (fails on CRITICAL)
#   Generate SBOM Syft -> CycloneDX + SPDX (from the built images)
#   Publish       push images to GHCR
#   Sign          Cosign *keyless* (GitHub OIDC -> Fulcio -> Rekor)
#   Verify        Cosign: unsigned image must be REJECTED, signed must be ACCEPTED
#   Deploy        re-verifies the signature before anything rolls out
#
# Note on ordering: the requested flow lists "Sign" before "Publish". Cosign
# stores the signature *in the registry alongside the image*, so the image must
# be pushed before it can be signed. Publish therefore precedes Sign here.
#
# Tool versions are pinned in `env` and must be kept in sync with the
# locally reproducible checks documented in docs/SECURITY-PIPELINE.md and
# docs/PHASE-5-SUPPLY-CHAIN.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  RUFF_VERSION: "0.16.10"
  SEMGREP_VERSION: "1.180.0"
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_VERSION: "0.75.0"
  SYFT_VERSION: "1.54.1"
  COSIGN_VERSION: "3.1.3"
  SC_VERSION: "3.0.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/backend/requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install ruff
        run: python -m pip install --quiet ruff==${{ env.RUFF_VERSION }}

      - name: ruff format --check (backend)
        working-directory: app/backend
        run: ruff format --check .

      - name: ruff check (backend)
        working-directory: app/backend
        run: ruff check .

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: eslint (frontend)
        working-directory: app/frontend
        run: npm run lint

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: app/backend
        run: python -m pip install --quiet -r requirements-dev.txt

      - name: Run pytest
        working-directory: app/backend
        run: python -m pytest

  sast:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: python -m pip install --quiet semgrep==${{ env.SEMGREP_VERSION }}

      - name: Semgrep SAST scan
        run: |
          semgrep scan --config p/ci --error --metrics off \
            --exclude .venv --exclude node_modules --exclude .next --exclude .git \
            app/backend app/frontend

  secret-scan:
    needs: sast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify Gitleaks
        run: |
          curl -sSL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o gitleaks_checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "linux_x64.tar.gz" gitleaks_checksums.txt > gitleaks.sum
          sha256sum -c gitleaks.sum
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Gitleaks secret scan
        run: ./gitleaks detect --source . --redact --exit-code 1 --verbose

  dependency-scan:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify Trivy
        run: |
          curl -sSL -o "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSL -o trivy_checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "Linux-64bit.tar.gz" trivy_checksums.txt > trivy.sum
          sha256sum -c trivy.sum
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy

      - name: Stage dev and tools manifests for scanning
        run: |
          # Trivy auto-detects files named exactly `requirements.txt`. The
          # development and tooling manifests are pinned separately, so stage
          # them under detectable names (in paths that avoid Trivy's dev/test
          # dependency heuristics).
          mkdir -p deps-scan/extra deps-scan/tools
          grep -v "^-r " app/backend/requirements-dev.txt > deps-scan/extra/requirements.txt
          cp requirements-tools.txt deps-scan/tools/requirements.txt

      - name: Scan auto-detected manifests
        run: |
          ./trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --skip-dirs node_modules --skip-dirs .next --skip-dirs .git .

      - name: Scan dev and tools manifests
        run: |
          ./trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --skip-dirs .git deps-scan

  docker-build:
    needs: dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build images
        run: |
          # The compose file requires POSTGRES_* variables. Values are
          # generated per-run and never committed anywhere.
          export POSTGRES_USER="securecloud_ci"
          POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export POSTGRES_PASSWORD
          export POSTGRES_DB="securecloud"
          docker compose build backend frontend

      - name: Export images
        run: docker save securecloud-backend securecloud-frontend | gzip > images.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  container-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: images
          path: .

      - name: Download and verify Trivy
        run: |
          curl -sSL -o "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSL -o trivy_checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "Linux-64bit.tar.gz" trivy_checksums.txt > trivy.sum
          sha256sum -c trivy.sum
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy

      - name: Load images
        run: docker load < images.tar.gz

      - name: Scan backend image
        run: |
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 securecloud-backend

      - name: Scan frontend image
        run: |
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 securecloud-frontend

      - name: Fail on CRITICAL container vulnerabilities (hard gate)
        run: |
          # A CRITICAL in a container stops the line, including ones with no
          # published fix yet - there is no --ignore-unfixed on this gate.
          ./trivy image --scanners vuln --severity CRITICAL --exit-code 1 securecloud-backend
          ./trivy image --scanners vuln --severity CRITICAL --exit-code 1 securecloud-frontend

  sbom:
    needs: container-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: images
          path: .

      - name: Load images
        run: docker load < images.tar.gz

      - name: Download and verify Syft
        run: |
          curl -sSL -o "syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o syft_checksums.txt \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          grep "linux_amd64.tar.gz" syft_checksums.txt > syft.sum
          sha256sum -c syft.sum
          tar -xzf "syft_${SYFT_VERSION}_linux_amd64.tar.gz" syft
          echo "$PWD" >> "$GITHUB_PATH"

      # The SBOM is built from the *shipped image* by scripts/sbom.sh, the same
      # command developers run locally, in both required formats.
      - name: Generate CycloneDX SBOM
        run: SBOM_FORMAT=cyclonedx-json bash scripts/sbom.sh securecloud-backend securecloud-frontend

      - name: Generate SPDX SBOM
        run: SBOM_FORMAT=spdx-json bash scripts/sbom.sh securecloud-backend securecloud-frontend

      - name: SBOM summary
        run: ls -la sbom/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          retention-days: 30

  publish:
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.push.outputs.backend }}
      frontend: ${{ steps.push.outputs.frontend }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: images
          path: .

      - name: Load images
        run: docker load < images.tar.gz

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push images to GHCR (still unsigned)
        id: push
        run: |
          set -euo pipefail
          BASE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/securecloud"
          echo "IMAGE_BASE=${BASE}" >> "$GITHUB_ENV"

          for svc in backend frontend; do
            docker tag "securecloud-${svc}" "${BASE}/${svc}:${SC_VERSION}"
            docker push "${BASE}/${svc}:${SC_VERSION}"
          done

          # Record the pushed digests so the signer signs exact bytes, not a tag.
          for svc in backend frontend; do
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "${BASE}/${svc}:${SC_VERSION}" | grep -F "${BASE}/${svc}@" | head -n 1)"
            echo "${svc}=${digest}" >> "$GITHUB_OUTPUT"
            echo "pushed ${digest}"
          done

  sign:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: GitHub issues the OIDC token
    env:
      SC_COSIGN_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@
      SC_COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify Cosign
        run: |
          curl -sSL -o cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          curl -sSL -o cosign_checksums.txt \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign_checksums.txt"
          grep -E "  cosign-linux-amd64$" cosign_checksums.txt > cosign.sum
          sha256sum -c cosign.sum
          chmod +x cosign
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Verification BEFORE signing: the image we just pushed carries no
      # signature yet, so it must be rejected. This is the "unsigned ->
      # verification fails" half of the demonstration.
      - name: "Verification: unsigned image must be REJECTED"
        id: unsigned
        run: |
          set +e
          bash scripts/image-verify.sh "ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/securecloud/backend:${SC_VERSION}"
          rc=$?
          set -e
          echo "rc=${rc}"
          if [ "${rc}" -eq 0 ]; then
            echo "::error::unsigned image verified successfully - signature enforcement is broken"
            exit 1
          fi
          echo "OK: unsigned image was rejected by cosign verify"

      # Keyless: no private key exists anywhere. GitHub's OIDC identity is
      # exchanged for a short-lived Fulcio cert; the signature + cert are
      # appended to Rekor and stored with the image in GHCR.
      - name: Sign images (keyless)
        run: |
          set -euo pipefail
          cosign sign --yes "${{ needs.publish.outputs.backend }}"
          cosign sign --yes "${{ needs.publish.outputs.frontend }}"

  verify:
    needs: [publish, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      SC_COSIGN_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@
      SC_COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify Cosign
        run: |
          curl -sSL -o cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          curl -sSL -o cosign_checksums.txt \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign_checksums.txt"
          grep -E "  cosign-linux-amd64$" cosign_checksums.txt > cosign.sum
          sha256sum -c cosign.sum
          chmod +x cosign
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The "signed -> verification succeeds" half of the demonstration.
      - name: "Verification: signed image must be ACCEPTED"
        run: |
          set -euo pipefail
          BASE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/securecloud"
          bash scripts/image-verify.sh "${BASE}/backend:${SC_VERSION}" "${BASE}/frontend:${SC_VERSION}"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deploy
    permissions:
      contents: read
      packages: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download and verify Cosign
        run: |
          curl -sSL -o cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          curl -sSL -o cosign_checksums.txt \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign_checksums.txt"
          grep -E "  cosign-linux-amd64$" cosign_checksums.txt > cosign.sum
          sha256sum -c cosign.sum
          chmod +x cosign
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Deployment gate: an unsigned or tampered image never reaches the cluster.
      - name: Verify image signatures (deployment gate)
        env:
          SC_COSIGN_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@
          SC_COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          BASE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/securecloud"
          bash scripts/image-verify.sh "${BASE}/backend:${SC_VERSION}" "${BASE}/frontend:${SC_VERSION}"

      - name: Apply manifests (when a cluster is configured)
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -n "${KUBE_CONFIG}" ]; then
            mkdir -p "$HOME/.kube"
            echo "${KUBE_CONFIG}" > "$HOME/.kube/config"
            kubectl apply -k kubernetes/overlays/local
            kubectl -n securecloud rollout status deploy/securecloud-backend --timeout=300s
            kubectl -n securecloud rollout status deploy/securecloud-frontend --timeout=300s
          else
            echo "Signature gate passed. No KUBE_CONFIG secret configured, so no cluster to apply to."
          fi