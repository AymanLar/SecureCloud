apiVersion: v1
kind: Service
metadata:
  name: securecloud-postgres
  namespace: securecloud
  labels:
    app: securecloud-postgres
    app.kubernetes.io/part-of: securecloud
spec:
  # Headless: the StatefulSet publishes each pod under
  # securecloud-postgres-0.securecloud-postgres.<namespace>.svc.cluster.local.
  clusterIP: None
  selector:
    app: securecloud-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres