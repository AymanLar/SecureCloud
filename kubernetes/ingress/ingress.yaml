# Single hostless Ingress for the local cluster: any Host header on the
# mapped port reaches the app. /api/* is routed to the backend, everything
# else to the frontend. (Production systems would pin a real host here.)
#
# ingressClassName is "traefik" because k3s/k3d ship Traefik as the default
# controller. On a kind+ingress-nginx cluster, change it to "nginx".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: securecloud
  namespace: securecloud
  labels:
    app.kubernetes.io/part-of: securecloud
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: securecloud-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: securecloud-frontend
                port:
                  name: http