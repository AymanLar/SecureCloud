# Default deny all ingress traffic into the securecloud namespace.
# Explicit allow rules live in the other files in this directory.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: securecloud
  labels:
    app.kubernetes.io/part-of: securecloud
spec:
  podSelector: {}
  policyTypes:
    - Ingress