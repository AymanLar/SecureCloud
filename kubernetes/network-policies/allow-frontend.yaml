# The web UI is only reachable from the ingress controller (Traefik).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: securecloud
  labels:
    app.kubernetes.io/part-of: securecloud
spec:
  podSelector:
    matchLabels:
      app: securecloud-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik