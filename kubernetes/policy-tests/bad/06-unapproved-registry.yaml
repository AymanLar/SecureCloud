# DELIBERATE VIOLATION - Policy 6 (approved registries).
# Pulls nginx from the public Docker Hub instead of an approved image.
# Expected under enforcement: REJECTED by
# securecloud-restrict-image-registries.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-registry
  namespace: securecloud
  labels:
    securecloud.io/policy-test: bad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-registry
  template:
    metadata:
      labels:
        app: bad-registry
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: nginx:1.27
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
