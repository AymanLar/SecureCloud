apiVersion: apps/v1
kind: Deployment
metadata:
  name: securecloud-frontend
  namespace: securecloud
  labels:
    app: securecloud-frontend
    app.kubernetes.io/part-of: securecloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securecloud-frontend
  template:
    metadata:
      labels:
        app: securecloud-frontend
        app.kubernetes.io/part-of: securecloud
    spec:
      serviceAccountName: securecloud-frontend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: securecloud-frontend:3.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            # nextjs user in the image: adduser --system --uid 1001
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}