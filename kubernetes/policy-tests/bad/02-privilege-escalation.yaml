# DELIBERATE VIOLATION - Policy 2 (privilege escalation).
# allowPrivilegeEscalation=true lets the process gain privileges (e.g. via a
# setuid binary). Expected under enforcement: REJECTED by
# securecloud-disallow-privilege-escalation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-privilege-escalation
  namespace: securecloud
  labels:
    securecloud.io/policy-test: bad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-privilege-escalation
  template:
    metadata:
      labels:
        app: bad-privilege-escalation
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: securecloud-backend:3.0.0
          securityContext:
            allowPrivilegeEscalation: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
